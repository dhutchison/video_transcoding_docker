name: Build, Sign & Publish Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: The tag version of video_transcoding to include
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  build-and-push-image:
    runs-on: ubuntu-latest

    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - name: Login to GHCR
        uses: docker/login-action@3999a1f4362c53e6a6048cde50f69868af81da5c
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push standard image
        id: build-standard
        uses: docker/build-push-action@2ca78c6bec76527009825f31aae0532b4d40d820
        with:
          context: .
          target: standard
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VIDEO_TRANSCODING_VERSION=${{ inputs.version }}
            BUILD_SCHEMA_VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ inputs.version }}
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ inputs.version }}-ruby3.4
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:latest

      - name: Generate standard image artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME}}
          subject-digest: ${{ steps.build-standard.outputs.digest }}
          push-to-registry: true

      - name: Validate standard multi-arch manifest
        run: |
          docker manifest inspect \
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ inputs.version }}

      - name: Build and push JDK image
        id: build-jdk
        uses: docker/build-push-action@2ca78c6bec76527009825f31aae0532b4d40d820
        with:
          context: .
          target: jdk
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VIDEO_TRANSCODING_VERSION=${{ inputs.version }}
            BUILD_SCHEMA_VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ inputs.version }}-ruby3.4-jdk21

      - name: Generate JDK image artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME}}
          subject-digest: ${{ steps.build-jdk.outputs.digest }}
          push-to-registry: true

      - name: Validate JDK multi-arch manifest
        run: |
          docker manifest inspect \
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ inputs.version }}-ruby3.4-jdk21
